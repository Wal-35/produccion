<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ILTEC - Sistema Integral Walner</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #161b22;
            --card: #0d1117;
            --iltec-green: #22c55e;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }

        /* Login con estilo industrial */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--card); padding: 40px; border-radius: 15px;
            border: 1px solid var(--border); width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ESTILOS NUEVOS PARA EL OJITO */
        .password-container {
            position: relative;
            width: 100%;
            margin-top: 5px;
        }
        .password-container input {
            padding-right: 45px; /* Espacio para el icono */
            margin-top: 0;
        }
        .toggle-eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #8b949e;
            font-size: 20px;
            user-select: none;
        }

        .logo { height: 70px; margin-bottom: 20px; }
        .nav-roles { display: flex; background: #010409; overflow-x: auto; border-bottom: 2px solid var(--iltec-green); }
        .role-btn { flex: 1; padding: 20px; border: none; background: none; color: #8b949e; cursor: pointer; font-weight: bold; text-transform: uppercase; min-width: 120px; }
        .role-btn.active { color: var(--iltec-green); border-bottom: 4px solid var(--iltec-green); background: rgba(34,197,94,0.1); }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .section { background: var(--card); border-radius: 12px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        input, select { width: 100%; padding: 15px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-top: 5px; }
        
        .btn-main { background: var(--iltec-green); color: #000; border: none; padding: 20px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; font-size: 18px; margin-top: 20px; }
        
        .table-wrap { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: center; }
        th { background: #21262d; color: var(--iltec-green); font-size: 11px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://wal-35.github.io/produccion/logoiltec.png" alt="ILTEC" class="logo">
            <h2 style="color: var(--iltec-green); margin-bottom: 30px;">ACCESO PROGRAMADOR</h2>
            <input type="email" id="auth-email" placeholder="walner718@gmail.com">
            
            <div class="password-container">
                <input type="password" id="auth-pass" placeholder="Tu Contraseña">
                <span class="toggle-eye" onclick="togglePasswordVisibility()">👁️</span>
            </div>

            <button class="btn-main" id="btn-login" onclick="handleAuth()">ENTRAR AL SISTEMA</button>
        </div>
    </div>

    <div id="app-main" class="hidden">
        <header style="text-align: center; padding: 15px; background: var(--card);">
            <img src="https://wal-35.github.io/produccion/logoiltec.png" alt="ILTEC" style="height: 40px;">
        </header>

        <nav class="nav-roles">
            <button class="role-btn active" onclick="switchRole('prog', event)">Programador</button>
            <button class="role-btn" onclick="switchRole('alist', event)">Alistador</button>
            <button class="role-btn" onclick="switchRole('prod', event)">Producción</button>
            <button class="role-btn" onclick="switchRole('cal', event)">Calidad</button>
        </nav>

        <div class="container">
            <div id="sec-prog" class="section">
                <h3>1. Datos de la Orden</h3>
                <div class="grid">
                    <div><label>Nº ORDEN (OP)</label><input type="text" id="p-op"></div>
                    <div><label>REFERENCIA ÍTEM</label><input type="text" id="p-item"></div>
                    <div><label>CANTIDAD</label><input type="number" id="p-cant"></div>
                </div>
            </div>

            <div id="sec-alist" class="section hidden">
                <h3>2. Alistamiento</h3>
                <div class="grid">
                    <div><label>NOMBRE ALISTADOR</label><input type="text" id="a-name"></div>
                    <div><label>UBICACIÓN</label><input type="text" id="a-loc"></div>
                </div>
            </div>

            <div id="sec-prod" class="section hidden">
                <h3>3. Punzonado y Doblado</h3>
                <div class="grid">
                    <div><label>HORA INICIO</label><input type="time" id="h-ini" onchange="calcularTiempo()"></div>
                    <div><label>HORA FINAL</label><input type="time" id="h-fin" onchange="calcularTiempo()"></div>
                    <div style="border: 2px dashed var(--iltec-green); padding: 10px; text-align: center;">
                        <small>TIEMPO NETO</small><br><b id="res-neto" style="font-size: 24px; color: var(--iltec-green);">00:00</b>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>LÁMINA/RETAL</th><th>MEDIDAS</th><th>SOBRANTE</th><th>MED. SOBRANTE</th><th>PIEZAS</th></tr>
                        </thead>
                        <tbody id="tbody-6x5"></tbody>
                    </table>
                </div>
            </div>

            <div id="sec-cal" class="section hidden">
                <h3>4. Calidad y Envío</h3>
                <div class="grid">
                    <div><label>CONFORME</label><input type="number" id="q-ok"></div>
                    <div><label>NO CONFORME</label><input type="number" id="q-bad"></div>
                </div>
                <button class="btn-main" onclick="saveFirebase()">💾 GUARDAR EN FIREBASE</button>
                <button class="btn-main" style="background: #25d366; color: white;" onclick="enviarAnalista()">📲 ENVIAR CSV A ANALISTA</button>
            </div>
        </div>
    </div>

    <script>
        // *** IMPORTANTE: REEMPLAZA ESTO CON TUS DATOS DE FIREBASE ***
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // LÓGICA DEL OJITO
        function togglePasswordVisibility() {
            const passInput = document.getElementById('auth-pass');
            const eyeIcon = document.querySelector('.toggle-eye');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerText = '🔒';
            } else {
                passInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        }

        // Generar filas 6x5
        const bodyTable = document.getElementById('tbody-6x5');
        for(let i=0; i<6; i++) {
            bodyTable.innerHTML += `<tr><td><input type="text"></td><td><input type="text"></td><td><input type="number"></td><td><input type="text"></td><td><input type="number"></td></tr>`;
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const btn = document.getElementById('btn-login');

            if(!email || !pass) {
                alert("Walner, por favor ingresa correo y contraseña.");
                return;
            }

            btn.innerText = "CARGANDO...";
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    console.log("Login exitoso");
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-main').classList.remove('hidden');
                })
                .catch((error) => {
                    btn.innerText = "ENTRAR AL SISTEMA";
                    btn.disabled = false;
                    alert("Error de Walner: " + error.message);
                });
        }

        function switchRole(id, e) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.remove('hidden');
            e.target.classList.add('active');
        }

        function calcularTiempo() {
            const h1 = document.getElementById('h-ini').value;
            const h2 = document.getElementById('h-fin').value;
            if(!h1 || !h2) return;
            let diff = (new Date("1970-01-01 " + h2) - new Date("1970-01-01 " + h1)) / 60000;
            if(diff < 0) diff += 1440;
            const hh = Math.floor(diff/60);
            const mm = diff % 60;
            document.getElementById('res-neto').innerText = `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
        }

        function saveFirebase() {
            db.collection("reportes_walner").add({
                op: document.getElementById('p-op').value,
                item: document.getElementById('p-item').value,
                tiempo: document.getElementById('res-neto').innerText,
                fecha: new Date().toLocaleString()
            }).then(() => alert("✅ Guardado en la nube")).catch(e => alert("Error: " + e));
        }

        function enviarAnalista() {
            const csv = `OP;TIEMPO;OK\n${document.getElementById('p-op').value};${document.getElementById('res-neto').innerText};${document.getElementById('q-ok').value}`;
            window.open(`https://wa.me/573182150158?text=${encodeURIComponent("*REPORTE ANALISTA*\n" + csv)}`);
        }
    </script>
</body>
</html>
